name: release-tag

# Reusable workflow that mints an annotated vX.Y.Z tag from a repo's declared
# version file on merge to main. Wraps actions/release-tag as a composite action.

on:
  workflow_call:
    inputs:
      version-file:
        description: 'Path to the version file.'
        required: false
        type: string
        default: pyproject.toml
      version-source:
        description: 'pyproject | plain | package-json.'
        required: false
        type: string
        default: pyproject
      tag-prefix:
        description: 'Tag name prefix.'
        required: false
        type: string
        default: v
      enforce-increase:
        description: 'Fail if not greater than latest tag.'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Compute/log but do not create the tag.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history + tags for describe / existence check
      - name: Resolve canonical action ref
        id: canonical-ref
        env:
          # github.job_workflow_ref / job_workflow_sha would name this reusable
          # workflow's own revision, but both arrive EMPTY on this runner. The
          # previous code stripped everything up to '@' from that empty value and
          # handed "" to actions/checkout, which silently falls back to this
          # repo's DEFAULT BRANCH. Every consumer was therefore validated against
          # whatever sat on .github main, never the revision it pinned — and that
          # stayed invisible for as long as main happened to match what consumers
          # had vendored. The moment a canonical file moved on main, every
          # consumer went red at once.
          #
          # github.workflow_ref IS populated and names the *calling* workflow
          # file, so recover the pinned revision from the caller's own uses: line.
          # Fail rather than guess: silently comparing against main is precisely
          # the failure mode this replaces.
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          caller="${CALLER_REF%@*}"
          caller="${caller#*/}"
          caller="${caller#*/}"
          ref=""
          if [ -f "$caller" ]; then
            ref=$(grep -oE "nos-tromo/\.github/\.github/workflows/release-tag\.yml@[^[:space:]\"']+" "$caller" \
                  | head -1 | sed 's/.*@//')
          fi
          if [ -z "$ref" ]; then
            echo "::error::Cannot determine which nos-tromo/.github revision to check out."
            echo "::error::Looked for a release-tag.yml pin in: $caller"
            echo "::error::Refusing to fall back to the default branch — that would validate this"
            echo "::error::repo against whatever is on .github main, not the revision it pinned."
            exit 1
          fi
          echo "canonical nos-tromo/.github revision: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical release-tag action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nos-tromo/.github
          ref: ${{ steps.canonical-ref.outputs.ref }}
          path: .nos-tromo-github-ref
      - uses: ./.nos-tromo-github-ref/actions/release-tag
        with:
          version-file: ${{ inputs.version-file }}
          version-source: ${{ inputs.version-source }}
          tag-prefix: ${{ inputs.tag-prefix }}
          enforce-increase: ${{ inputs.enforce-increase }}
          dry-run: ${{ inputs.dry-run }}
