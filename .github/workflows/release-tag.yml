name: release-tag

# Reusable workflow that mints an annotated vX.Y.Z tag from a repo's declared
# version file on merge to main. Wraps actions/release-tag as a composite action.

on:
  workflow_call:
    inputs:
      version-file:
        description: 'Path to the version file.'
        required: false
        type: string
        default: pyproject.toml
      version-source:
        description: 'pyproject | plain.'
        required: false
        type: string
        default: pyproject
      tag-prefix:
        description: 'Tag name prefix.'
        required: false
        type: string
        default: v
      enforce-increase:
        description: 'Fail if not greater than latest tag.'
        required: false
        type: boolean
        default: true
      dry-run:
        description: 'Compute/log but do not create the tag.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0        # full history + tags for describe / existence check
      - name: Resolve canonical action ref
        id: canonical-ref
        env:
          # github.job_workflow_ref points to this reusable workflow itself
          # (e.g. nos-tromo/.github/.github/workflows/release-tag.yml@<sha>);
          # stripping everything up to '@' recovers the exact ref the caller
          # pinned. Checking out the composite action at that same ref keeps
          # workflow and action version-locked with no mutable tag in between.
          WORKFLOW_REF: ${{ github.job_workflow_ref }}
        run: |
          ref="${WORKFLOW_REF##*@}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical release-tag action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nos-tromo/.github
          ref: ${{ steps.canonical-ref.outputs.ref }}
          path: .nos-tromo-github-ref
      - uses: ./.nos-tromo-github-ref/actions/release-tag
        with:
          version-file: ${{ inputs.version-file }}
          version-source: ${{ inputs.version-source }}
          tag-prefix: ${{ inputs.tag-prefix }}
          enforce-increase: ${{ inputs.enforce-increase }}
          dry-run: ${{ inputs.dry-run }}
