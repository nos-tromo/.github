name: self-ci

# Self-CI for the org-wide .github repo. The repo's two main workflows are
# reusable (`on: workflow_call`) and don't fire on pushes here — without this
# file, nothing would lint or test the validator script that gatekeeps every
# consumer's strict-mode regime.
#
# Jobs:
#   lint-validator      — `ruff check` + `ruff format --check` against scripts/
#                         using the canonical strict config, pinned to the same
#                         ruff version consumers use (read out of
#                         precommit-versions.yaml so there's one source of truth).
#   validator-smoke     — validate_strict_config.py vs aligned (must exit 0),
#                         drifted (non-zero), and half-migrated (non-zero)
#                         fixtures. Catches regressions in the validator itself.
#   make-common-smoke   — validate_make_common.py vs its aligned/drifted/absent/
#                         included-but-absent fixtures, plus the `build` target's
#                         version-persistence behavior script.
#   bundle-lib-smoke    — validate_bundle_lib.py vs its fixtures, plus the
#                         bundle_version / bundle_checkout_release behavior scripts.
#   eslint-config-smoke — validate_eslint_config.py vs its aligned/drifted/absent
#                         fixtures.
#   pins-smoke          — validate_action_pins.py vs its aligned/drifted/absent
#                         fixtures, plus this repo's own workflows (the hub
#                         enforces the SHA-pin policy on itself).
#   uipin-smoke         — validate_infra_ui_pin.py vs its aligned/drifted/absent
#                         fixtures (@infra/ui must be pinned by commit SHA,
#                         never a mutable tag).
#   release-tag-unit    — pytest suite for actions/release-tag/extract_version.py
#                         (the version extractor + anti-downgrade comparator).
#
# Security note: no step interpolates untrusted user input from
# github.event.*; the only `${{ ... }}` reference is a step output we
# generated ourselves, and it is still routed through `env:` to keep it out
# of the shell command line.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Keep in sync with the uv-version default in python-app-ci.yml; the
          # "Assert uv pin matches python-app-ci" step below fails on drift.
          version: 0.12.11
      - name: Assert uv pin matches python-app-ci
        env:
          # The literal this job's setup-uv step pins. Consumers get their uv from
          # python-app-ci's uv-version default, so a hub bump that misses one of the
          # two places would leave the hub testing its validators on a different uv
          # than every consumer runs. Cheap to assert, invisible when it drifts.
          SELF_CI_UV: '0.12.11'
        run: |
          default=$(awk '/^      uv-version:/{f=1} f && /^        default:/{
            gsub(/^        default: *|'"'"'/, ""); print; exit}' \
            .github/workflows/python-app-ci.yml)
          if [ -z "$default" ]; then
            echo "::error::Could not read the uv-version default from .github/workflows/python-app-ci.yml"
            exit 1
          fi
          if [ "$default" != "$SELF_CI_UV" ]; then
            echo "::error::uv pin drift: self-ci.yml pins $SELF_CI_UV, python-app-ci.yml defaults to $default"
            echo "::error::Bump both together (see the uv-version comment in python-app-ci.yml)."
            exit 1
          fi
          echo "uv pin OK: $default"
      - name: Read pinned ruff version
        id: ruff
        run: |
          # precommit-versions.yaml stores `ruff: v0.15.14`; uvx wants the
          # bare PyPI version, so strip the leading `v`.
          v=$(grep '^ruff:' configs/python-strict/precommit-versions.yaml \
              | awk '{print $2}' | tr -d '"' | sed 's/^v//')
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: Ruff check
        env:
          VER: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff@$VER" check --config configs/python-strict/ruff.toml scripts/
      - name: Ruff format --check
        env:
          VER: ${{ steps.ruff.outputs.version }}
        run: uvx "ruff@$VER" format --config configs/python-strict/ruff.toml --check scripts/

  validator-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # Also exercises the `target-version` allowed-override path: the
        # aligned fixture deliberately sets target-version to py312 while
        # canonical is py311.
        run: python3 scripts/validate_strict_config.py --consumer-root tests/fixtures/aligned
      - name: Drifted fixture should fail
        run: |
          if python3 scripts/validate_strict_config.py --consumer-root tests/fixtures/drifted; then
            echo "Bug: validator returned 0 on a drifted fixture" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on drift"
      - name: Half-migrated fixture should fail (mypy not removed)
        # Correct pyrefly setup but leftover mypy ([tool.mypy] block, dev dep,
        # hook): a half-migration must fail CI, not silently pass with two
        # type-checkers installed.
        run: |
          if python3 scripts/validate_strict_config.py --consumer-root tests/fixtures/half-migrated; then
            echo "Bug: validator returned 0 when mypy was left behind" >&2
            exit 1
          fi
          echo "OK: validator rejects a half-migration (mypy leftover)"

  make-common-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # tests/fixtures/mk-aligned/make/common.mk must mirror
        # configs/make-common/common.mk exactly - this job fails if it drifts,
        # the same signal a real consumer gets.
        run: python3 scripts/validate_make_common.py --consumer-root tests/fixtures/mk-aligned
      - name: Drifted fixture should fail
        run: |
          if python3 scripts/validate_make_common.py --consumer-root tests/fixtures/mk-drifted; then
            echo "Bug: validator returned 0 on a drifted fixture" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on drift"
      - name: Absent + not included should skip (pass)
        run: python3 scripts/validate_make_common.py --consumer-root tests/fixtures/mk-absent
      - name: Included-but-absent fixture should fail
        # Makefile has `include make/common.mk` but no vendored copy -> required.
        run: |
          if python3 scripts/validate_make_common.py --consumer-root tests/fixtures/mk-required-absent; then
            echo "Bug: validator returned 0 when the Makefile includes common.mk but it is absent" >&2
            exit 1
          fi
          echo "OK: validator correctly failed on included-but-absent common.mk"
      - name: build persists the built tag (override > fresh date+sha; failed build leaves the file untouched)
        run: bash tests/build_persist_smoke.sh

  bundle-lib-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # tests/fixtures/bundle-aligned/scripts/bundle-lib.sh must mirror
        # configs/bundle/bundle-lib.sh exactly - this job fails if it drifts.
        run: python3 scripts/validate_bundle_lib.py --consumer-root tests/fixtures/bundle-aligned
      - name: Drifted fixture should fail
        run: |
          if python3 scripts/validate_bundle_lib.py --consumer-root tests/fixtures/bundle-drifted; then
            echo "Bug: validator returned 0 on a drifted fixture" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on drift"
      - name: Absent + no wrapper should skip (pass)
        run: python3 scripts/validate_bundle_lib.py --consumer-root tests/fixtures/bundle-absent
      - name: Sourced-but-absent fixture should fail
        # scripts/bundle_images.sh sources bundle-lib.sh but no vendored copy -> required.
        run: |
          if python3 scripts/validate_bundle_lib.py --consumer-root tests/fixtures/bundle-required-absent; then
            echo "Bug: validator returned 0 when bundle_images.sh sources bundle-lib.sh but it is absent" >&2
            exit 1
          fi
          echo "OK: validator correctly failed on sourced-but-absent bundle-lib.sh"
      - name: bundle_version behavior (override > annotated tag > date+sha)
        run: bash tests/bundle_version_smoke.sh
      - name: bundle_checkout_release behavior (resolve tag, checkout+restore, refuse dirty/no-tag)
        run: bash tests/bundle_checkout_smoke.sh

  eslint-config-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # tests/fixtures/eslint-aligned/frontend/eslint.config.js must mirror
        # configs/frontend-eslint/eslint.config.js exactly - this job fails if it drifts.
        run: python3 scripts/validate_eslint_config.py --consumer-root tests/fixtures/eslint-aligned
      - name: Drifted fixture should fail
        run: |
          if python3 scripts/validate_eslint_config.py --consumer-root tests/fixtures/eslint-drifted; then
            echo "Bug: validator returned 0 on a drifted fixture" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on drift"
      - name: Absent vendored copy should skip (pass)
        run: python3 scripts/validate_eslint_config.py --consumer-root tests/fixtures/eslint-absent

  pins-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # Fully SHA-pinned refs, a local ./action, and a commented-out
        # unpinned ref that must be ignored.
        run: python3 scripts/validate_action_pins.py --consumer-root tests/fixtures/pins-aligned
      - name: Drifted fixture should fail
        run: |
          if python3 scripts/validate_action_pins.py --consumer-root tests/fixtures/pins-drifted; then
            echo "Bug: validator returned 0 on tag-pinned action refs" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on unpinned refs"
      - name: No workflows should skip (pass)
        run: python3 scripts/validate_action_pins.py --consumer-root tests/fixtures/pins-absent
      - name: This repo's own workflows must be pinned
        # The hub ships the policy, so it is subject to it: every `uses:` in
        # .github/workflows/ and actions/*/action.yml must name a full SHA.
        run: python3 scripts/validate_action_pins.py --consumer-root .

  uipin-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        # SHA-pinned codeload URL in both package.json and pnpm-lock.yaml.
        run: python3 scripts/validate_infra_ui_pin.py --consumer-root tests/fixtures/uipin-aligned
      - name: Drifted fixture should fail
        # Tag-named codeload URL — mutable, so the validator must reject it
        # in the manifest and in the lockfile.
        run: |
          if python3 scripts/validate_infra_ui_pin.py --consumer-root tests/fixtures/uipin-drifted; then
            echo "Bug: validator returned 0 on a tag-pinned @infra/ui spec" >&2
            exit 1
          fi
          echo "OK: validator correctly returned non-zero on a tag-pinned spec"
      - name: No frontend should skip (pass)
        run: python3 scripts/validate_infra_ui_pin.py --consumer-root tests/fixtures/uipin-absent

  profile-smoke:
    # The profile page describes twelve sibling repositories, so most of its
    # claims can only be checked against checkouts this job does not have.
    # What IS checkable here is everything internal to the hub: the fixtures,
    # the page's own structure, and the claims about this repository. The
    # cross-repo half runs on a schedule in profile-audit.yml, because member
    # drift is external and must never redden an unrelated PR.
    #
    # Exit codes are asserted exactly. The `if ...; then fail` idiom used by
    # the other smoke jobs accepts any non-zero status, which would let a
    # traceback masquerade as a detected drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'
      - name: Aligned fixture should pass
        run: |
          rc=0
          python3 scripts/validate_profile_claims.py \
            --profile tests/fixtures/profile-aligned/profile/README.md \
            --claims tests/fixtures/profile-aligned/profile/claims.toml \
            --members-root tests/fixtures/profile-aligned/members || rc=$?
          [ "$rc" -eq 0 ] || { echo "Bug: aligned fixture exited $rc, want 0" >&2; exit 1; }
      - name: Drifted fixture should report drift
        # The anchored env line is gone from the member's compose file.
        run: |
          rc=0
          python3 scripts/validate_profile_claims.py \
            --profile tests/fixtures/profile-drifted/profile/README.md \
            --claims tests/fixtures/profile-drifted/profile/claims.toml \
            --members-root tests/fixtures/profile-drifted/members || rc=$?
          [ "$rc" -eq 1 ] || { echo "Bug: drifted fixture exited $rc, want 1" >&2; exit 1; }
      - name: A row with no claim should report drift
        run: |
          rc=0
          python3 scripts/validate_profile_claims.py \
            --profile tests/fixtures/profile-uncovered/profile/README.md \
            --claims tests/fixtures/profile-uncovered/profile/claims.toml \
            --members-root tests/fixtures/profile-uncovered/members || rc=$?
          [ "$rc" -eq 1 ] || { echo "Bug: uncovered fixture exited $rc, want 1" >&2; exit 1; }
      - name: A missing checkout should be unsound, not drift
        # Exit 2 is what stops the scheduled job opening a false drift issue
        # when a clone fails.
        run: |
          rc=0
          python3 scripts/validate_profile_claims.py \
            --profile tests/fixtures/profile-member-absent/profile/README.md \
            --claims tests/fixtures/profile-member-absent/profile/claims.toml \
            --members-root tests/fixtures/profile-member-absent/members || rc=$?
          [ "$rc" -eq 2 ] || { echo "Bug: absent-member fixture exited $rc, want 2" >&2; exit 1; }
      - name: This repo's own profile claims must hold
        # No member clones: --only-present skips the cross-repo claims and
        # leaves the page structure, the quote coverage, and every claim about
        # this repository itself.
        run: |
          rc=0
          python3 scripts/validate_profile_claims.py \
            --members-root . --member .github=. --only-present || rc=$?
          [ "$rc" -eq 0 ] || { echo "Bug: hub's own profile claims exited $rc, want 0" >&2; exit 1; }
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Keep in sync with the uv-version default in python-app-ci.yml.
          version: 0.12.11
      - name: Unit tests
        # Parsing and assertion semantics (case-sensitive paths, comment
        # skipping, hit ceilings) are unit-tested; the fixtures above only
        # pin the exit-code contract.
        run: uv run --with pytest python -m pytest tests/test_profile_claims.py -q

  release-tag-unit:
    # Unit tests for actions/release-tag/extract_version.py — the version
    # extractor and anti-downgrade comparator the release-tag action depends on.
    # Nothing else in the repo exercises them, so without this job the action
    # would ship untested. Run via uv with an ephemeral pytest (the module is
    # stdlib-only); pin Python 3.11 to match the action's own runtime.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # Keep in sync with the uv-version default in python-app-ci.yml; the
          # "Assert uv pin matches python-app-ci" step below fails on drift.
          version: 0.12.11
      - name: Pytest
        working-directory: actions/release-tag
        run: uv run --python 3.11 --with pytest python -m pytest -q
