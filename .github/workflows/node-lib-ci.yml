name: node-lib-ci

# Reusable workflow for nos-tromo Node/TypeScript libraries (currently infra-ui,
# the @infra/ui design system). Runs the package's own pnpm quality gates — lint,
# typecheck, test, build — and can verify that a committed, prebuilt output dir
# (e.g. dist/) is in sync with source, so a library that ships its build output
# in git cannot merge a source change that skipped the rebuild.
#
# Distinct from python-app-ci.yml (uv/Python apps) and infra-validation.yml
# (compose/Docker repos): this is for pnpm/TypeScript packages with no Python.
# The pnpm version is taken from the package's "packageManager" field.

on:
  workflow_call:
    inputs:
      node-version:
        required: false
        type: string
        default: '22'
      working-directory:
        description: 'Package directory (where package.json + pnpm-lock.yaml live).'
        required: false
        type: string
        default: '.'
      run-lint:
        description: 'Run `pnpm lint`.'
        required: false
        type: boolean
        default: true
      run-typecheck:
        description: 'Run `pnpm typecheck`.'
        required: false
        type: boolean
        default: true
      run-test:
        description: 'Run `pnpm test`.'
        required: false
        type: boolean
        default: true
      run-build:
        description: 'Run `pnpm build` (implied true when check-dist is set).'
        required: false
        type: boolean
        default: true
      check-dist:
        description: 'After build, fail if the committed <dist-dir> differs from a fresh build (for libraries that commit prebuilt output to git).'
        required: false
        type: boolean
        default: false
      dist-dir:
        description: 'Output directory checked by check-dist.'
        required: false
        type: string
        default: 'dist'

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pnpm version comes from the "packageManager" field in package.json.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        if: ${{ inputs.run-lint }}
        run: pnpm lint
      - name: Typecheck
        if: ${{ inputs.run-typecheck }}
        run: pnpm typecheck
      - name: Test
        if: ${{ inputs.run-test }}
        run: pnpm test
      - name: Build
        if: ${{ inputs.run-build || inputs.check-dist }}
        run: pnpm build
      - name: Verify committed output dir is in sync with source
        # `pnpm build` above regenerated the output dir. If that differs from
        # what's committed (modified tracked files or new untracked output), the
        # committed copy is stale — fail so it gets rebuilt and committed.
        if: ${{ inputs.check-dist }}
        env:
          DIST_DIR: ${{ inputs.dist-dir }}
        run: |
          if [ -n "$(git status --porcelain -- "$DIST_DIR")" ]; then
            echo "::error::$DIST_DIR is out of sync with source. Run 'pnpm build' and commit $DIST_DIR."
            git status --porcelain -- "$DIST_DIR"
            git --no-pager diff -- "$DIST_DIR"
            exit 1
          fi

  action-pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve canonical ref
        id: canonical-ref
        env:
          # github.job_workflow_ref / job_workflow_sha would name this reusable
          # workflow's own revision, but both arrive EMPTY on this runner. The
          # previous code stripped everything up to '@' from that empty value and
          # handed "" to actions/checkout, which silently falls back to this
          # repo's DEFAULT BRANCH. Every consumer was therefore validated against
          # whatever sat on .github main, never the revision it pinned — and that
          # stayed invisible for as long as main happened to match what consumers
          # had vendored. The moment a canonical file moved on main, every
          # consumer went red at once.
          #
          # github.workflow_ref IS populated and names the *calling* workflow
          # file, so recover the pinned revision from the caller's own uses: line.
          # Fail rather than guess: silently comparing against main is precisely
          # the failure mode this replaces.
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          caller="${CALLER_REF%@*}"
          caller="${caller#*/}"
          caller="${caller#*/}"
          ref=""
          if [ -f "$caller" ]; then
            ref=$(grep -oE "nos-tromo/\.github/\.github/workflows/node-lib-ci\.yml@[^[:space:]\"']+" "$caller" \
                  | head -1 | sed 's/.*@//')
          fi
          if [ -z "$ref" ]; then
            echo "::error::Cannot determine which nos-tromo/.github revision to check out."
            echo "::error::Looked for a node-lib-ci.yml pin in: $caller"
            echo "::error::Refusing to fall back to the default branch — that would validate this"
            echo "::error::repo against whatever is on .github main, not the revision it pinned."
            exit 1
          fi
          echo "canonical nos-tromo/.github revision: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nos-tromo/.github
          ref: ${{ steps.canonical-ref.outputs.ref }}
          path: .nos-tromo-github-ref
      - name: Validate workflow action pins
        # Every `uses:` in the consumer's workflows must reference a full commit
        # SHA (supply-chain hardening); local `./path` actions are exempt.
        run: python3 .nos-tromo-github-ref/scripts/validate_action_pins.py
