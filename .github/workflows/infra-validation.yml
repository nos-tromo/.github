name: infra-validation

# Reusable workflow for nos-tromo infra repos (vllm-service, data-plane).
# Validates compose syntax, lints YAML, lints Dockerfiles, lints shell scripts,
# and verifies the signed provenance of digest-pinned images.

on:
  workflow_call:
    inputs:
      compose-files:
        description: 'Space-separated -f arguments for `docker compose config`. Omit to skip compose validation entirely (for infra repos that own no compose files, e.g. deploy, which only sequences the members'' compose).'
        required: false
        type: string
        default: ''
      compose-profiles:
        description: 'Space-separated --profile arguments. Example: "--profile cpu --profile cuda".'
        required: false
        type: string
        default: ''
      dockerfiles-glob:
        description: 'Glob for hadolint. Defaults to docker/Dockerfile.*.'
        required: false
        type: string
        default: 'docker/Dockerfile.*'
      shell-scripts-glob:
        description: 'Glob for shellcheck. Defaults to scripts/*.sh.'
        required: false
        type: string
        default: 'scripts/*.sh'

permissions:
  contents: read

jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install yamllint
        run: pipx install yamllint
      - name: Lint YAML
        run: |
          yamllint -d "{extends: relaxed, rules: {line-length: disable, document-start: disable}}" .

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run shellcheck
        env:
          GLOB: ${{ inputs.shell-scripts-glob }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2086
          files=( $GLOB )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No shell scripts matched $GLOB; skipping."
            exit 0
          fi
          shellcheck "${files[@]}"

  hadolint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run hadolint on Dockerfiles
        env:
          GLOB: ${{ inputs.dockerfiles-glob }}
        run: |
          shopt -s nullglob
          # shellcheck disable=SC2086
          files=( $GLOB )
          if [ ${#files[@]} -eq 0 ]; then
            echo "No Dockerfiles matched $GLOB; skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            # Fail only on hadolint `error`-level findings; warnings/info/style
            # are surfaced in the log but don't block the build. Consumers that
            # want stricter checking can drop a .hadolint.yaml in the repo.
            docker run --rm -i ghcr.io/hadolint/hadolint:v2.12.0@sha256:30a8fd2e785ab6176eed53f74769e04f125afb2f74a6c52aef7d463583b6d45e hadolint --failure-threshold error - < "$f"
          done

  compose-config:
    # Skipped when the caller passes no compose-files — e.g. deploy, which owns
    # no compose of its own and only sequences the members'. Mirrors the other
    # jobs here, which already skip when their target files are absent.
    if: ${{ inputs.compose-files != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Stub external networks + volumes
        # External resources declared in compose must exist before `docker compose
        # config` will resolve. Create idempotently; mirrors `make network`.
        run: |
          docker network create inference-net >/dev/null 2>&1 || true
          docker network create data-net >/dev/null 2>&1 || true
          docker volume create huggingface-cache >/dev/null 2>&1 || true
      - name: Stub required env vars
        # Placeholder values for variable interpolation only; never committed.
        run: |
          {
            echo "NEO4J_PASSWORD=ci-placeholder-not-real"
            echo "OPENAI_API_KEY=sk-ci-placeholder"
          } > .env
      - name: Validate compose
        env:
          FILES: ${{ inputs.compose-files }}
          PROFILES: ${{ inputs.compose-profiles }}
        run: docker compose --env-file .env $FILES $PROFILES config --quiet

  make-common:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Resolve canonical ref
        id: canonical-ref
        env:
          # github.job_workflow_ref / job_workflow_sha would name this reusable
          # workflow's own revision, but both arrive EMPTY on this runner. The
          # previous code stripped everything up to '@' from that empty value and
          # handed "" to actions/checkout, which silently falls back to this
          # repo's DEFAULT BRANCH. Every consumer was therefore validated against
          # whatever sat on .github main, never the revision it pinned — and that
          # stayed invisible for as long as main happened to match what consumers
          # had vendored. The moment a canonical file moved on main, every
          # consumer went red at once.
          #
          # github.workflow_ref IS populated and names the *calling* workflow
          # file, so recover the pinned revision from the caller's own uses: line.
          # Fail rather than guess: silently comparing against main is precisely
          # the failure mode this replaces.
          CALLER_REF: ${{ github.workflow_ref }}
        run: |
          caller="${CALLER_REF%@*}"
          caller="${caller#*/}"
          caller="${caller#*/}"
          ref=""
          if [ -f "$caller" ]; then
            ref=$(grep -oE "nos-tromo/\.github/\.github/workflows/infra-validation\.yml@[^[:space:]\"']+" "$caller" \
                  | head -1 | sed 's/.*@//')
          fi
          if [ -z "$ref" ]; then
            echo "::error::Cannot determine which nos-tromo/.github revision to check out."
            echo "::error::Looked for a infra-validation.yml pin in: $caller"
            echo "::error::Refusing to fall back to the default branch — that would validate this"
            echo "::error::repo against whatever is on .github main, not the revision it pinned."
            exit 1
          fi
          echo "canonical nos-tromo/.github revision: $ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Checkout canonical .github
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nos-tromo/.github
          ref: ${{ steps.canonical-ref.outputs.ref }}
          path: .nos-tromo-github-ref
      - name: Validate make/common.mk alignment
        # Skips automatically until the repo vendors make/common.mk; fails only
        # on a drifted vendored copy.
        run: python3 .nos-tromo-github-ref/scripts/validate_make_common.py
      - name: Validate scripts/bundle-lib.sh alignment
        # Same skip-when-absent semantics as make/common.mk.
        run: python3 .nos-tromo-github-ref/scripts/validate_bundle_lib.py
      - name: Validate workflow action pins
        # Every `uses:` in the consumer's workflows must reference a full commit
        # SHA (supply-chain hardening); local `./path` actions are exempt.
        run: python3 .nos-tromo-github-ref/scripts/validate_action_pins.py
      - name: Install cosign
        # For the cosign-signed entries of the image-provenance policy.
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify signed image provenance
        # Every digest-pinned image whose publisher signs it (the hub's
        # configs/image-provenance/signers.toml) must verify; unsigned images
        # are listed in the job summary. gh needs the token to read attestations.
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .nos-tromo-github-ref/scripts/validate_image_provenance.py
