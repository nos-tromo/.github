version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
  # Dependabot does not descend into composite-action subdirectories, so the
  # SHA-pinned `uses:` refs in actions/*/action.yml need their own entry.
  - package-ecosystem: github-actions
    directory: "/actions/release-tag"
    schedule:
      interval: weekly
