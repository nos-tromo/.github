version: 2
# Every entry waits 7 days after an upstream release before proposing it, so a
# compromised or broken release is usually caught and pulled upstream first.
# Security updates are exempt and still open immediately. The third-party
# actions pinned here reach every consumer, which makes this the entry point
# worth guarding.
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  # Dependabot does not descend into composite-action subdirectories, so the
  # SHA-pinned `uses:` refs in actions/*/action.yml need their own entry.
  - package-ecosystem: github-actions
    directory: "/actions/release-tag"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
